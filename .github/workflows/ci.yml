name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain
        run: swift --version

      - name: Build
        run: swift build -c release

      - name: Self test (no Xcode needed)
        run: .build/release/yue-hidpi selftest

      - name: XCTest
        run: swift test

      - name: Enumerate displays
        run: .build/release/yue-hidpi list

      - name: Doctor (informational on CI runners)
        run: .build/release/yue-hidpi doctor || true

      - name: Universal binary
        run: make universal

      - name: Upload universal binary
        uses: actions/upload-artifact@v4
        with:
          name: yue-hidpi-universal
          path: .build/universal/yue-hidpi
          if-no-files-found: error
